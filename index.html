<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="./style.css">
    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>
</head>
<body>
    <header id="header">
            <aside class="sidebar closed" id="sidebar">
                <div class="sidebar_header">
               <button id="menuBtn"> <i class="fa-solid fa-bars"></i> </button>
                <h3 id="menu">Menu</h3>
                </div>
                <nav>
                    <ul>
                        <li> <a href="index.html"> <i class="fa-solid fa-house"></i>   <span>Dashboard</span></a> </li>
                        <li> <a href="products.html"> <i class="fa-solid fa-box"></i>  <span>Products</span></a></li>
                        <li> <a href="categories.html"> <i class="fa-solid fa-layer-group"></i><span>Categories</span></a></li>
                        <li> <a href="#"><i class="fa-solid fa-chart-column"></i>  <span>Reports</span></a></li>
                        <li> <a href="#"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
                    </ul>
                </nav>
            </aside>
            <main class="main_content">
            <div class="page_header">
                 <h1>Welcome Back !</h1>
                 <p>Manage your Inventory</p>
            </div>
            <section class="summary">
    <div class="cards">
        <p>Total Products</p>
    </div>

     <div class="cards">
        <p>Total Stock</p>
    </div>

     <div class="cards">
        <p>Low Stock</p>
    </div>

     <div class="cards">
        <p>Total value</p>
    </div>

 </div>
   </section>
    
   <section id="hero">
    <h4>Add New Iteam </h4>
    
    <div class="cards_large">
        <form action="" id="productFrom">
        
      <div class="from_group"> <label> Product Name</label> <input id="productName" type="text" placeholder="Enter the Product Name"> </div>
      <div class="from_group"> <label> Categories</label> <select id="Categories"> </div>
        <option value="" >Choose</option>
         <option value="Food & Beverages">Food & Beverages</option>
          <option value="Electronics">Electronics</option>
           <option value="Clothing">Clothing</option>
            <option value="Grocery">Grocery</option>
            <option value="Furniture">Furniture</option>
            <option value="Statinonery">Statinonery</option>
            <option value="Health & Beauty">Health & Beauty</option>
            <option value="Home Appliances">Home Appliance</option>
            <option value="Sports">Sports</option>
            <option value="Automative">Automative</option>
            <option value="Other">Other</option>

      </select> </div>
        <div class="from_group"> <label> Price</label> <input id="Price" type="number" placeholder="Enter the Price"> </div>
       <div class="from_group">  <label> Quantity</label> <input id="Quantity" type="number" placeholder="Enter the Quantity"> </div>
        <button id="addBtn" type="button"> Add Item</button>
        </form>
   </section>

            </main>
    </header>


   

    <script src="./script.js"></script>
</body>
</html>
